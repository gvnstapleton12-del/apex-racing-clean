services:
  apex:
    build: .
    container_name: apex-racing
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /home/jackal/apex-racing-clean/data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
    deploy:
      resources:
        limits:
          memory: 10G
