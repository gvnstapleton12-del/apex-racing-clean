services:
  apex:
    build: .
    container_name: apex-racing
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - /home/jackal/apex-racing-clean/data:/app/data
      - /home/jackal/apex-racing-clean/.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
    deploy:
      resources:
        limits:
          memory: 10G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
