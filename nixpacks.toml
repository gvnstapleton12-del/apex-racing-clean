[phases.install]
cmds = [
  "pnpm install --no-frozen-lockfile",
  "npx playwright install chromium",
  "pnpm rebuild sqlite3"
]

[phases.build]
cmds = ["pnpm run build"]

[nixPkgs]
pkgs = [
  "glib",
  "nss",
  "nspr",
  "at-spi2-core",
  "atk",
  "cups",
  "dbus",
  "libdrm",
  "libxkbcommon",
  "libxcomposite",
  "libxdamage",
  "libxfixes",
  "libxrandr",
  "libgbm",
  "libasound",
  "pango",
  "cairo",
  "fontconfig",
  "freetype",
  "harfbuzz",
  "gtk3",
  "libxshmfence",
  "libxss",
  "libxtst",
  "alsa-lib",
  "libffi",
  "zlib",
  "bzip2",
  "expat",
  "libpng",
  "libjpeg-turbo",
  "libwebp",
  "openjpeg2",
  "woff2",
  "brotli",
  "libavif"
]