name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 192.168.4.27
          username: jackal
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          script: |
            cd /mnt/storage/apex-racing-clean
            git pull --rebase origin main
            npm install --omit=dev
            pm2 restart apex || (pm2 start ecosystem.config.cjs && pm2 save)
